name: Build RealisticSurvival for Minecraft 26.1.2

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realistic-survival-mc26-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('.github/ci/spigot-versions.txt') }}
          restore-keys: |
            m2-

      - name: Install Spigot 26.1.2 with BuildTools
        run: bash .github/ci/run-buildtools.sh "$GITHUB_WORKSPACE"

      - name: Generate compile-only RealisticSeasons API stub
        run: bash .github/ci/make-realisticseasons-stub.sh

      - name: Build plugin for Minecraft 26
        run: mvn -B -ntp -DskipTests -pl dist26 -am package

      - name: Verify compatibility JAR contents
        shell: bash
        run: bash .github/ci/verify-mc26-jar.sh

      - name: Publish JAR to the mc26-builds branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/ci/publish-mc26-jar.sh
